name: Feature request
description: Suggest an idea or improvement.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and how you would use it on your Stream Deck.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: What does it make easier or possible?
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - macOS
        - Windows
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mock-ups, examples from other plugins, links…
